<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Sarah Arora</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(151, 71, 255, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(255, 70, 170, 0.12),
                    transparent 35%
                ),
                #09090d;

            color: #fff;

            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    120deg,
                    transparent,
                    rgba(255,255,255,0.025),
                    transparent
                );

            pointer-events: none;
        }

        .login-wrapper {
            width: min(92%, 420px);

            animation: appear 0.7s ease forwards;
        }

        .login-card {
            position: relative;

            padding: 42px 34px;

            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.075),
                    rgba(255,255,255,0.025)
                );

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .logo {
            width: 58px;
            height: 58px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    rgba(177, 91, 255, 0.35),
                    rgba(255, 91, 181, 0.25)
                );

            border: 1px solid rgba(255,255,255,0.12);

            font-size: 24px;

            box-shadow:
                0 10px 35px rgba(151,71,255,0.20);
        }

        h1 {
            margin: 0;

            text-align: center;

            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 9px 0 30px;

            text-align: center;

            color: rgba(255,255,255,0.52);

            font-size: 14px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            color: rgba(255,255,255,0.65);
        }

        input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 14px;

            outline: none;

            background: rgba(255,255,255,0.045);

            color: #fff;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        input::placeholder {
            color: rgba(255,255,255,0.28);
        }

        input:focus {
            border-color: rgba(184, 108, 255, 0.65);

            background: rgba(255,255,255,0.065);

            box-shadow:
                0 0 0 4px rgba(168, 83, 255, 0.09);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 52px;
        }

        .toggle-password {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            border: 0;

            background: transparent;

            color: rgba(255,255,255,0.45);

            cursor: pointer;

            font-size: 15px;

            padding: 8px;
        }

        .toggle-password:hover {
            color: #fff;
        }

        .login-button {
            width: 100%;

            margin-top: 8px;

            padding: 14px 18px;

            border: 0;
            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #9a55ff,
                    #d04dca
                );

            color: #fff;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 12px 30px rgba(154,85,255,0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 16px 38px rgba(154,85,255,0.32);
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .login-button.loading {
            opacity: 0.65;
            pointer-events: none;
        }

        .error {
            min-height: 20px;

            margin-top: 16px;

            text-align: center;

            color: #ff8e9d;

            font-size: 13px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* RESPONSIVE */
        html { min-height: 100%; background: #09090d; }
        body {
            min-height: 100vh; min-height: 100dvh; width: 100%;
            padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
            overflow: auto;
        }
        .login-wrapper { width: min(100%, 420px); }
        .login-card { width: 100%; }
        input, button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        input { min-height: 48px; }
        .login-button { min-height: 48px; }
        .toggle-password { min-width: 44px; min-height: 44px; }

        @media (max-width: 600px) {
            body { align-items: center; justify-content: center; padding: 14px; }
            .login-wrapper { width: 100%; max-width: 420px; }
            .login-card { padding: 34px 24px; border-radius: 24px; }
            .logo { width: 54px; height: 54px; margin-bottom: 18px; }
            h1 { font-size: 24px; }
            .subtitle { margin-bottom: 26px; font-size: 13px; }
            .field { margin-bottom: 15px; }
            label { font-size: 12px; }
            input { min-height: 50px; padding: 14px; font-size: 16px; }
            .login-button { min-height: 50px; font-size: 15px; }
        }

        @media (max-width: 380px) {
            body { padding-left: 11px; padding-right: 11px; }
            .login-card { padding: 28px 18px; border-radius: 22px; }
            .logo { width: 50px; height: 50px; margin-bottom: 15px; font-size: 21px; }
            h1 { font-size: 22px; }
            .subtitle { margin-top: 7px; margin-bottom: 22px; }
        }

        @media (max-height: 620px) {
            body { align-items: flex-start; padding-top: 12px; padding-bottom: 12px; }
            .login-card { padding-top: 24px; padding-bottom: 24px; }
            .logo { margin-bottom: 12px; }
            .subtitle { margin-bottom: 18px; }
            .field { margin-bottom: 11px; }
            .login-button { margin-top: 3px; }
        }

    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="logo">
            ✦
        </div>

        <h1>Admin Access</h1>

        <p class="subtitle">
            Sarah Arora · Private Dashboard
        </p>

        <form id="loginForm">

            <div class="field">
                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    autocomplete="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="field">
                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        id="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Enter password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        ◉
                    </button>

                </div>
            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Sign In
            </button>

            <div
                class="error"
                id="errorMessage"
                aria-live="polite"
            ></div>

        </form>

    </div>

</div>

<script>
    const form = document.getElementById("loginForm");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const errorMessage = document.getElementById("errorMessage");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
        const showing = password.type === "text";

        password.type = showing ? "password" : "text";

        togglePassword.textContent = showing ? "◉" : "◉";
    });

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        errorMessage.textContent = "";

        loginButton.classList.add("loading");
        loginButton.textContent = "Signing in...";

        try {
            const response = await fetch("/api/admin/login", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username.value,
                    password: password.value
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(
                    data.error || "Unable to sign in."
                );
            }

            window.location.href = "/pages/admin-chat.html";

        } catch (error) {

            errorMessage.textContent =
                error.message || "Something went wrong.";

            loginButton.classList.remove("loading");
            loginButton.textContent = "Sign In";
        }
    });
</script>

</body>
</html>
