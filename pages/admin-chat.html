<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Space Admin | Sarah Arora</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color: #fff;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(154, 78, 255, 0.16),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(235, 78, 181, 0.10),
            transparent 30%
        ),
        #08080c;
}

/* APP */

.app {
    width: 100%;
    height: 100vh;

    display: flex;

    overflow: hidden;
}

/* SIDEBAR */

.sidebar {
    width: 330px;
    flex-shrink: 0;

    display: flex;
    flex-direction: column;

    border-right:
        1px solid rgba(255,255,255,0.08);

    background:
        rgba(255,255,255,0.025);

    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
}

.brand {
    padding: 22px 22px 18px;

    border-bottom:
        1px solid rgba(255,255,255,0.07);
}

.brand-title {
    font-size: 18px;
    font-weight: 650;
}

.brand-subtitle {
    margin-top: 4px;

    color:
        rgba(255,255,255,0.42);

    font-size: 12px;
}

/* FILTERS */

.filters {
    display: grid;
    grid-template-columns: repeat(4, 1fr);

    gap: 6px;

    padding: 13px;
}

.filter {
    position: relative;

    padding: 10px 5px;

    border: 1px solid transparent;
    border-radius: 11px;

    background:
        rgba(255,255,255,0.035);

    color:
        rgba(255,255,255,0.48);

    font-size: 11px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
}

.filter:hover {
    color: #fff;

    background:
        rgba(255,255,255,0.065);
}

.filter.active {
    color: #fff;

    background:
        rgba(255,255,255,0.08);

    border-color:
        rgba(255,255,255,0.09);
}

.filter-count {
    display: block;

    margin-top: 4px;

    font-size: 16px;
    font-weight: 600;
}

/* CONVERSATION LIST */

.conversations {
    flex: 1;

    overflow-y: auto;

    padding: 4px 10px 15px;
}

.conversations::-webkit-scrollbar {
    width: 5px;
}

.conversations::-webkit-scrollbar-thumb {
    background:
        rgba(255,255,255,0.10);

    border-radius: 10px;
}

.conversation {
    position: relative;

    width: 100%;

    padding: 14px 13px;

    margin-bottom: 6px;

    border: 1px solid transparent;
    border-radius: 15px;

    background:
        rgba(255,255,255,0.025);

    cursor: pointer;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.15s ease;
}

.conversation:hover {
    background:
        rgba(255,255,255,0.055);

    transform: translateY(-1px);
}

.conversation.selected {
    background:
        rgba(158,83,255,0.10);

    border-color:
        rgba(171,100,255,0.25);
}

.conversation-top {
    display: flex;
    align-items: center;

    gap: 8px;
}

.status-light {
    width: 8px;
    height: 8px;

    flex-shrink: 0;

    border-radius: 50%;
}

.status-light.pending {
    background: #f2a14a;
    box-shadow: 0 0 9px rgba(242,161,74,0.5);
}

.status-light.replied {
    background: #62dc98;
    box-shadow: 0 0 9px rgba(98,220,152,0.4);
}

.status-light.ignored {
    background: #f05c68;
    box-shadow: 0 0 9px rgba(240,92,104,0.4);
}

.conversation-id {
    flex: 1;

    overflow: hidden;

    color: rgba(255,255,255,0.78);

    font-family: monospace;
    font-size: 12px;

    white-space: nowrap;
    text-overflow: ellipsis;
}

.conversation-time {
    color:
        rgba(255,255,255,0.30);

    font-size: 10px;
}

.conversation-preview {
    margin-top: 8px;

    color:
        rgba(255,255,255,0.48);

    font-size: 12px;
    line-height: 1.4;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* MAIN */

.main {
    flex: 1;

    min-width: 0;

    display: flex;
    flex-direction: column;
}

/* HEADER */

.main-header {
    height: 73px;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 0 25px;

    border-bottom:
        1px solid rgba(255,255,255,0.07);

    background:
        rgba(255,255,255,0.018);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.selected-info {
    flex: 1;
}

.selected-id {
    font-family: monospace;

    font-size: 14px;
    font-weight: 600;
}

.selected-status {
    margin-top: 3px;

    color:
        rgba(255,255,255,0.40);

    font-size: 11px;
}

.refresh-button {
    width: 38px;
    height: 38px;

    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 11px;

    background:
        rgba(255,255,255,0.04);

    color:
        rgba(255,255,255,0.70);

    cursor: pointer;

    font-size: 17px;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}

.refresh-button:hover {
    background:
        rgba(255,255,255,0.08);

    transform: rotate(25deg);
}

/* CHAT */

.chat {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 30px;

    scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
    width: 6px;
}

.chat::-webkit-scrollbar-thumb {
    background:
        rgba(255,255,255,0.09);

    border-radius: 10px;
}

.empty {
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    color:
        rgba(255,255,255,0.35);
}

.empty-icon {
    width: 64px;
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 16px;

    border-radius: 20px;

    background:
        rgba(255,255,255,0.045);

    border:
        1px solid rgba(255,255,255,0.07);

    font-size: 25px;
}

.empty-title {
    color:
        rgba(255,255,255,0.75);

    font-size: 16px;
    font-weight: 600;
}

.empty-subtitle {
    margin-top: 6px;

    font-size: 12px;
}

/* MESSAGE */

.message-row {
    display: flex;

    margin-bottom: 18px;
}

.message-row.visitor {
    justify-content: flex-start;
}

.message-row.admin {
    justify-content: flex-end;
}

.message {
    max-width: min(70%, 620px);
}

.message-author {
    margin-bottom: 5px;

    color:
        rgba(255,255,255,0.35);

    font-size: 10px;
}

.message-row.admin .message-author {
    text-align: right;
}

.bubble {
    padding: 12px 15px;

    border-radius: 17px;

    font-size: 14px;
    line-height: 1.5;

    white-space: pre-wrap;
    word-break: break-word;
}

.message-row.visitor .bubble {
    border-bottom-left-radius: 5px;

    background:
        rgba(255,255,255,0.065);

    border:
        1px solid rgba(255,255,255,0.065);
}

.message-row.admin .bubble {
    border-bottom-right-radius: 5px;

    background:
        linear-gradient(
            135deg,
            #9453f7,
            #c04fbe
        );

    box-shadow:
        0 8px 25px rgba(143,74,246,0.16);
}

.message-time {
    margin-top: 5px;

    color:
        rgba(255,255,255,0.28);

    font-size: 9px;
}

.message-row.admin .message-time {
    text-align: right;
}

/* COMPOSER */

.composer {
    display: none;

    padding: 14px 20px 18px;

    border-top:
        1px solid rgba(255,255,255,0.07);

    background:
        rgba(0,0,0,0.12);
}

.composer.active {
    display: block;
}

.composer-box {
    display: flex;
    align-items: flex-end;

    gap: 9px;
}

textarea {
    flex: 1;

    min-height: 48px;
    max-height: 130px;

    resize: none;

    padding: 13px 15px;

    border:
        1px solid rgba(255,255,255,0.09);

    border-radius: 15px;

    outline: none;

    background:
        rgba(255,255,255,0.045);

    color: #fff;

    font-family: inherit;
    font-size: 13px;

    transition:
        border-color 0.2s ease;
}

textarea:focus {
    border-color:
        rgba(168,91,255,0.48);
}

textarea::placeholder {
    color:
        rgba(255,255,255,0.28);
}

.action-button {
    height: 46px;

    padding: 0 16px;

    border: 0;
    border-radius: 13px;

    color: #fff;

    font-size: 12px;
    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        opacity 0.15s ease;
}

.action-button:hover {
    transform: translateY(-1px);
}

.action-button:active {
    transform: scale(0.97);
}

.reply-button {
    background:
        linear-gradient(
            135deg,
            #9553f8,
            #c84fbe
        );
}

.link-button {
    background:
        rgba(100,180,255,0.14);

    border:
        1px solid rgba(100,180,255,0.20);
}

.ignore-button {
    background:
        rgba(240,88,100,0.10);

    border:
        1px solid rgba(240,88,100,0.18);

    color:
        #ff8d98;
}

/* LOADING */

.loading {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        #08080c;
}

.loading.hidden {
    display: none;
}

.loader {
    width: 30px;
    height: 30px;

    border:
        2px solid rgba(255,255,255,0.12);

    border-top-color:
        #a55bff;

    border-radius: 50%;

    animation:
        spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* RESPONSIVE */
html { min-height: 100%; background: #08080c; }
body { min-height: 100vh; min-height: 100dvh; width: 100%; overflow: hidden; }
.app { width: 100%; height: 100vh; height: 100dvh; }
.sidebar, .main { min-height: 0; }
.conversations, .chat { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
button, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
textarea { -webkit-appearance: none; appearance: none; }

@media (max-width: 1100px) {
    .sidebar { width: 290px; }
    .chat { padding: 24px; }
    .message { max-width: min(76%, 620px); }
    .composer { padding-left: 16px; padding-right: 16px; }
    .action-button { padding-left: 13px; padding-right: 13px; }
}

@media (max-width: 800px) {
    .sidebar { width: 265px; }
    .brand { padding: 18px 17px 15px; }
    .filters { padding: 10px; gap: 5px; }
    .filter { padding: 9px 4px; font-size: 10px; }
    .filter-count { font-size: 15px; }
    .conversations { padding-left: 8px; padding-right: 8px; }
    .conversation { padding: 13px 11px; }
    .main-header { height: 66px; padding: 0 18px; }
    .chat { padding: 20px 17px; }
    .message { max-width: 82%; }
    .composer { padding: 10px 13px max(10px, env(safe-area-inset-bottom)) 13px; }
    .composer-box { gap: 7px; }
    .action-button { min-height: 44px; height: 44px; padding: 0 12px; font-size: 11px; }
}

@media (max-width: 650px) {
    body { overflow: hidden; }
    .app { display: flex; flex-direction: column; height: 100dvh; min-height: 100dvh; }
    .sidebar { width: 100%; height: 43dvh; min-height: 270px; max-height: 430px; flex: 0 1 43dvh; border-right: 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .brand { padding: 14px 14px 11px; }
    .brand-title { font-size: 16px; }
    .brand-subtitle { font-size: 11px; }
    .filters { grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 10px; gap: 5px; }
    .filter { min-width: 0; min-height: 48px; padding: 7px 3px; border-radius: 10px; font-size: 10px; }
    .filter-count { margin-top: 2px; font-size: 15px; }
    .conversations { padding: 2px 9px max(12px, env(safe-area-inset-bottom)) 9px; }
    .conversation { min-height: 68px; margin-bottom: 5px; padding: 12px 11px; border-radius: 13px; }
    .conversation-preview { margin-top: 6px; font-size: 11px; }
    .conversation-time { font-size: 9px; }
    .main { width: 100%; height: 57dvh; min-height: 0; flex: 1 1 auto; }
    .main-header { height: 58px; min-height: 58px; padding: 0 12px; }
    .selected-id { font-size: 13px; }
    .selected-status { font-size: 10px; }
    .refresh-button { width: 42px; height: 42px; flex-shrink: 0; }
    .chat { padding: 16px 11px max(12px, env(safe-area-inset-bottom)); }
    .message { max-width: 88%; }
    .bubble { padding: 10px 12px; border-radius: 15px; font-size: 13px; }
    .message-author { font-size: 9px; }
    .message-time { font-size: 8px; }
    .composer { padding: 8px 9px max(9px, env(safe-area-inset-bottom)) 9px; }
    .composer-box { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    textarea { width: 100%; min-width: 0; min-height: 44px; max-height: 112px; grid-column: 1 / -1; padding: 11px 12px; font-size: 16px; border-radius: 13px; }
    .action-button { width: 100%; min-width: 0; height: 44px; min-height: 44px; padding: 0 5px; border-radius: 11px; font-size: 10px; white-space: nowrap; }
    .empty-icon { width: 56px; height: 56px; font-size: 22px; }
    .empty-title { font-size: 14px; }
    .empty-subtitle { font-size: 11px; }
}

@media (max-width: 390px) {
    .sidebar { height: 45dvh; min-height: 255px; }
    .main { height: 55dvh; }
    .brand { padding-top: 12px; padding-bottom: 8px; }
    .filters { padding-top: 6px; padding-bottom: 6px; }
    .filter { min-height: 44px; font-size: 9px; }
    .filter-count { font-size: 14px; }
    .conversation { min-height: 62px; padding: 10px; }
    .main-header { height: 54px; min-height: 54px; }
    .chat { padding-top: 12px; }
    .action-button { font-size: 9px; }
}

@media (max-height: 650px) and (max-width: 650px) {
    .sidebar { min-height: 220px; }
    .conversation { min-height: 56px; padding-top: 9px; padding-bottom: 9px; }
    .main-header { height: 52px; min-height: 52px; }
    .composer { padding-top: 6px; }
    textarea { min-height: 40px; }
    .action-button { height: 40px; min-height: 40px; }
}

</style>
</head>

<body>

<div class="loading" id="loading">
    <div class="loader"></div>
</div>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-title">
                Chat Space
            </div>

            <div class="brand-subtitle">
                Sarah Arora · Admin
            </div>
        </div>

        <div class="filters">

            <button
                class="filter active"
                data-filter="all"
            >
                All
                <span
                    class="filter-count"
                    id="countAll"
                >0</span>
            </button>

            <button
                class="filter"
                data-filter="pending"
            >
                Pending
                <span
                    class="filter-count"
                    id="countPending"
                >0</span>
            </button>

            <button
                class="filter"
                data-filter="replied"
            >
                Replied
                <span
                    class="filter-count"
                    id="countReplied"
                >0</span>
            </button>

            <button
                class="filter"
                data-filter="ignored"
            >
                Ignored
                <span
                    class="filter-count"
                    id="countIgnored"
                >0</span>
            </button>

        </div>

        <div
            class="conversations"
            id="conversationList"
        ></div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="main-header">

            <div class="selected-info">

                <div
                    class="selected-id"
                    id="selectedId"
                >
                    Select a conversation
                </div>

                <div
                    class="selected-status"
                    id="selectedStatus"
                >
                    Choose a conversation from the list
                </div>

            </div>

            <button
                class="refresh-button"
                id="refreshButton"
                title="Refresh"
            >
                ↻
            </button>

        </header>


        <section
            class="chat"
            id="chat"
        >

            <div class="empty">

                <div class="empty-icon">
                    💬
                </div>

                <div class="empty-title">
                    No conversation selected
                </div>

                <div class="empty-subtitle">
                    Select a message from the left.
                </div>

            </div>

        </section>


        <!-- COMPOSER -->

        <div
            class="composer"
            id="composer"
        >

            <div class="composer-box">

                <textarea
                    id="replyInput"
                    placeholder="Reply as Sarah..."
                    maxlength="5000"
                ></textarea>

                <button
                    class="action-button reply-button"
                    id="replyButton"
                >
                    Reply
                </button>

                <button
                    class="action-button link-button"
                    id="linkButton"
                >
                    🔗 Send Link
                </button>

                <button
                    class="action-button ignore-button"
                    id="ignoreButton"
                >
                    Ignore
                </button>

            </div>

        </div>

    </main>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

/*
    Replace this with your actual payment page URL.

    Example:
    https://saraharora.in/pages/pay.html
*/

const PAYMENT_LINK =
    "https://cosmofeed.com/vig/6a741edfc235eb0013489e8d";


/* =========================================================
   STATE
========================================================= */

let conversations = [];

let currentFilter = "all";

let selectedConversationId = null;

let pollTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const loading =
    document.getElementById("loading");

const conversationList =
    document.getElementById("conversationList");

const chat =
    document.getElementById("chat");

const composer =
    document.getElementById("composer");

const selectedId =
    document.getElementById("selectedId");

const selectedStatus =
    document.getElementById("selectedStatus");

const replyInput =
    document.getElementById("replyInput");

const replyButton =
    document.getElementById("replyButton");

const linkButton =
    document.getElementById("linkButton");

const ignoreButton =
    document.getElementById("ignoreButton");

const refreshButton =
    document.getElementById("refreshButton");


/* =========================================================
   AUTH CHECK
========================================================= */

async function checkAuthentication() {

    const response =
        await fetch("/api/admin/me");

    if (!response.ok) {

        window.location.href =
            "/pages/admin-login.html";

        return false;
    }

    const data =
        await response.json();

    if (!data.authenticated) {

        window.location.href =
            "/pages/admin-login.html";

        return false;
    }

    return true;
}


/* =========================================================
   LOAD CONVERSATIONS
========================================================= */

async function loadConversations() {

    try {

        const response =
            await fetch(
                "/api/admin/conversations"
            );

        if (response.status === 401) {

            window.location.href =
                "/pages/admin-login.html";

            return;
        }

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {
            throw new Error(
                data.error ||
                "Unable to load conversations."
            );
        }

        conversations =
            data.conversations || [];

        updateCounts();

        renderConversationList();

    } catch (error) {

        console.error(error);

    }

}


/* =========================================================
   COUNTS
========================================================= */

function updateCounts() {

    const all =
        conversations.length;

    const pending =
        conversations.filter(
            c => c.status === "pending"
        ).length;

    const replied =
        conversations.filter(
            c => c.status === "replied"
        ).length;

    const ignored =
        conversations.filter(
            c => c.status === "ignored"
        ).length;


    document.getElementById(
        "countAll"
    ).textContent = all;

    document.getElementById(
        "countPending"
    ).textContent = pending;

    document.getElementById(
        "countReplied"
    ).textContent = replied;

    document.getElementById(
        "countIgnored"
    ).textContent = ignored;

}


/* =========================================================
   RENDER LIST
========================================================= */

function renderConversationList() {

    conversationList.innerHTML = "";

    let filtered =
        conversations.filter(
            conversation => {

                if (
                    currentFilter === "all"
                ) {
                    return true;
                }

                return (
                    conversation.status ===
                    currentFilter
                );

            }
        );


    if (!filtered.length) {

        conversationList.innerHTML = `
            <div style="
                padding:30px 15px;
                text-align:center;
                color:rgba(255,255,255,0.30);
                font-size:12px;
            ">
                No conversations here.
            </div>
        `;

        return;
    }


    for (const conversation of filtered) {

        const item =
            document.createElement("div");

        item.className =
            "conversation";


        if (
            conversation.id ===
            selectedConversationId
        ) {
            item.classList.add(
                "selected"
            );
        }


        const time =
            formatTime(
                conversation.updated_at
            );


        item.innerHTML = `
            <div class="conversation-top">

                <span
                    class="status-light ${conversation.status}"
                ></span>

                <span class="conversation-id">
                    #${escapeHtml(conversation.id)}
                </span>

                <span class="conversation-time">
                    ${time}
                </span>

            </div>

            <div class="conversation-preview">
                ${escapeHtml(
                    conversation.latest_message ||
                    "No messages"
                )}
            </div>
        `;


        item.addEventListener(
            "click",
            () => {

                openConversation(
                    conversation.id
                );

            }
        );


        conversationList.appendChild(
            item
        );

    }

}


/* =========================================================
   OPEN CONVERSATION
========================================================= */

async function openConversation(
    conversationId
) {

    selectedConversationId =
        conversationId;

    renderConversationList();

    chat.innerHTML = `
        <div class="empty">
            <div class="empty-icon">
                ⏳
            </div>

            <div class="empty-title">
                Loading conversation...
            </div>
        </div>
    `;


    composer.classList.add(
        "active"
    );


    try {

        const response =
            await fetch(
                `/api/admin/conversation?id=${encodeURIComponent(
                    conversationId
                )}`
            );


        if (response.status === 401) {

            window.location.href =
                "/pages/admin-login.html";

            return;
        }


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to load conversation."
            );

        }


        selectedId.textContent =
            `#${data.conversation.id}`;


        selectedStatus.textContent =
            formatStatus(
                data.conversation.status
            );


        renderMessages(
            data.messages || []
        );


    } catch (error) {

        chat.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    ⚠️
                </div>

                <div class="empty-title">
                    Unable to load conversation
                </div>

                <div class="empty-subtitle">
                    ${escapeHtml(error.message)}
                </div>
            </div>
        `;

    }

}


/* =========================================================
   RENDER MESSAGES
========================================================= */

function renderMessages(messages) {

    chat.innerHTML = "";


    if (!messages.length) {

        chat.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    💬
                </div>

                <div class="empty-title">
                    No messages
                </div>
            </div>
        `;

        return;
    }


    for (const message of messages) {

        const row =
            document.createElement("div");

        row.className =
            `message-row ${
                message.sender === "admin"
                    ? "admin"
                    : "visitor"
            }`;


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message";


        const author =
            document.createElement("div");

        author.className =
            "message-author";

        author.textContent =
            message.sender === "admin"
                ? "Sarah"
                : "Visitor";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";

        const paymentMarker =
            "[[PAYMENT_LINK]]";

        if (
            message.message.includes(paymentMarker)
        ) {

            const parts =
                message.message.split(
                    paymentMarker
                );

            const textBefore =
                parts[0].trim();

            if (textBefore) {

                const messageText =
                    document.createElement("div");

                messageText.textContent =
                    textBefore;

                bubble.appendChild(
                    messageText
                );
            }


            const paymentUrl =
                parts[1].trim();


            const linkButton =
                document.createElement("a");

            linkButton.href =
                paymentUrl;

            linkButton.target =
                "_blank";

            linkButton.rel =
                "noopener noreferrer";

            linkButton.textContent =
                "🔗 Open Exclusive Page";

            linkButton.style.display =
                "inline-flex";

            linkButton.style.marginTop =
                "10px";

            linkButton.style.padding =
                "9px 13px";

            linkButton.style.borderRadius =
                "10px";

            linkButton.style.background =
                "rgba(255,255,255,0.16)";

            linkButton.style.border =
                "1px solid rgba(255,255,255,0.18)";

            linkButton.style.color =
                "#fff";

            linkButton.style.textDecoration =
                "none";

            linkButton.style.fontSize =
                "12px";

            linkButton.style.fontWeight =
                "600";

            bubble.appendChild(
                linkButton
            );

        } else {

            bubble.textContent =
                message.message;
        }


        const time =
            document.createElement("div");

        time.className =
            "message-time";

        time.textContent =
            formatDateTime(
                message.created_at
            );


        wrapper.appendChild(
            author
        );

        wrapper.appendChild(
            bubble
        );

        wrapper.appendChild(
            time
        );

        row.appendChild(
            wrapper
        );

        chat.appendChild(
            row
        );

    }


    requestAnimationFrame(() => {

        chat.scrollTop =
            chat.scrollHeight;

    });

}


/* =========================================================
   REPLY
========================================================= */

async function sendReply() {

    const message =
        replyInput.value.trim();


    if (
        !selectedConversationId ||
        !message
    ) {
        return;
    }


    replyButton.disabled = true;

    replyButton.textContent =
        "Sending...";


    try {

        const response =
            await fetch(
                "/api/admin/reply",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        conversationId:
                            selectedConversationId,

                        message
                    })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to send reply."
            );

        }


        replyInput.value = "";

        resizeReplyBox();


        await openConversation(
            selectedConversationId
        );

        await loadConversations();


    } catch (error) {

        alert(
            error.message ||
            "Unable to send reply."
        );

    }


    replyButton.disabled = false;

    replyButton.textContent =
        "Reply";

}

/* =========================================================
   FILTERS
========================================================= */

document
    .querySelectorAll(".filter")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".filter"
                    )
                    .forEach(
                        b =>
                            b.classList.remove(
                                "active"
                            )
                    );


                button.classList.add(
                    "active"
                );


                currentFilter =
                    button.dataset.filter;


                renderConversationList();

            }
        );

    });


/* =========================================================
   REFRESH
========================================================= */

refreshButton.addEventListener(
    "click",
    async () => {

        refreshButton.style.transform =
            "rotate(360deg)";

        await loadConversations();

        if (selectedConversationId) {

            await openConversation(
                selectedConversationId
            );

        }

        setTimeout(() => {

            refreshButton.style.transform =
                "";

        }, 300);

    }
);


/* =========================================================
   REPLY INPUT
========================================================= */

replyButton.addEventListener(
    "click",
    sendReply
);

linkButton.addEventListener(
    "click",
    sendPaymentLink
);

ignoreButton.addEventListener(
    "click",
    ignoreConversation
);


replyInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            (event.ctrlKey || event.metaKey)
        ) {

            event.preventDefault();

            sendReply();

        }

    }
);


replyInput.addEventListener(
    "input",
    resizeReplyBox
);


function resizeReplyBox() {

    replyInput.style.height =
        "auto";

    replyInput.style.height =
        Math.min(
            replyInput.scrollHeight,
            130
        ) + "px";

}


/* =========================================================
   POLLING
========================================================= */

function startPolling() {

    if (pollTimer) {
        clearInterval(pollTimer);
    }


    pollTimer =
        setInterval(
            async () => {

                await loadConversations();


                if (
                    selectedConversationId
                ) {

                    await openConversation(
                        selectedConversationId
                    );

                }

            },
            5000
        );

}


/* =========================================================
   HELPERS
========================================================= */

function formatTime(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleTimeString(
        [],
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );

}


function formatDateTime(
    dateString
) {

    const date =
        new Date(dateString);

    return date.toLocaleString(
        [],
        {
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit"
        }
    );

}


function formatStatus(status) {

    if (status === "pending") {
        return "🟠 Pending";
    }

    if (status === "replied") {
        return "🟢 Replied";
    }

    if (status === "ignored") {
        return "🔴 Ignored";
    }

    return status;

}


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize() {

    const authenticated =
        await checkAuthentication();


    if (!authenticated) {
        return;
    }


    await loadConversations();


    loading.classList.add(
        "hidden"
    );


    startPolling();

}


initialize();
