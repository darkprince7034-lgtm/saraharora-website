<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat Space | Sarah Arora</title>

    <meta
        name="description"
        content="Have a private conversation with Sarah."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 16px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(150, 72, 255, 0.20),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(255, 72, 184, 0.16),
                    transparent 34%
                ),
                #08080c;

            overflow: hidden;
        }

        body::before {
            content: "";

            position: fixed;
            inset: -50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,0.035) 1px,
                    transparent 1px
                );

            background-size: 38px 38px;

            animation: drift 30s linear infinite;

            pointer-events: none;
        }

        .chat-shell {
            position: relative;

            width: min(760px, 100%);
            height: min(760px, calc(100vh - 60px));

            display: flex;
            flex-direction: column;

            overflow: hidden;

            border:
                1px solid rgba(255,255,255,0.11);

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.075),
                    rgba(255,255,255,0.025)
                );

            backdrop-filter: blur(26px);
            -webkit-backdrop-filter: blur(26px);

            box-shadow:
                0 40px 100px rgba(0,0,0,0.50),
                inset 0 1px 0 rgba(255,255,255,0.08);

            animation: appear 0.7s ease;
        }

        /* HEADER */

        .chat-header {
            display: flex;
            align-items: center;

            gap: 13px;

            padding: 18px 21px;

            border-bottom:
                1px solid rgba(255,255,255,0.07);

            background:
                rgba(255,255,255,0.025);
        }

        .avatar {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #a05aff,
                    #db56bd
                );

            box-shadow:
                0 8px 24px rgba(153,78,255,0.25);

            font-size: 19px;
            font-weight: 600;
        }

        .header-info {
            flex: 1;
            min-width: 0;
        }

        .header-name {
            font-size: 15px;
            font-weight: 600;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 6px;

            margin-top: 3px;

            font-size: 12px;

            color:
                rgba(255,255,255,0.48);
        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #67e39a;

            box-shadow:
                0 0 9px rgba(103,227,154,0.7);

            animation: pulse 2s infinite;
        }

        /* MESSAGES */

        .messages {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding: 24px 20px 20px;

            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background:
                rgba(255,255,255,0.10);

            border-radius: 10px;
        }

        .welcome {
            text-align: center;

            padding: 50px 20px 30px;

            color:
                rgba(255,255,255,0.48);
        }

        .welcome-icon {
            width: 64px;
            height: 64px;

            margin: 0 auto 17px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background:
                rgba(255,255,255,0.055);

            border:
                1px solid rgba(255,255,255,0.08);

            font-size: 25px;
        }

        .welcome h2 {
            margin: 0 0 8px;

            color: #fff;

            font-size: 21px;
            font-weight: 600;
        }

        .welcome p {
            max-width: 430px;

            margin: auto;

            font-size: 13px;
            line-height: 1.6;
        }

        .message-row {
            display: flex;

            margin-bottom: 12px;

            animation:
                messageIn 0.28s ease forwards;
        }

        .message-row.visitor {
            justify-content: flex-end;
        }

        .message-row.admin {
            justify-content: flex-start;
        }

        .bubble {
            max-width: min(76%, 520px);

            padding: 11px 14px;

            border-radius: 18px;

            font-size: 14px;
            line-height: 1.5;

            word-break: break-word;
            white-space: pre-wrap;
        }

        .visitor .bubble {
            border-bottom-right-radius: 6px;

            background:
                linear-gradient(
                    135deg,
                    #9655ff,
                    #c950c3
                );

            box-shadow:
                0 7px 20px rgba(153,75,255,0.18);
        }

        .admin .bubble {
            border-bottom-left-radius: 6px;

            background:
                rgba(255,255,255,0.075);

            border:
                1px solid rgba(255,255,255,0.07);
        }

        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;

            gap: 5px;

            margin-top: 5px;

            font-size: 10px;

            color:
                rgba(255,255,255,0.48);
        }

        .visitor .message-meta {
            color:
                rgba(255,255,255,0.70);
        }

        .tick {
            font-size: 11px;
            letter-spacing: -3px;
        }

        /* TYPING */

        .typing {
            display: none;

            padding: 0 20px 10px;
        }

        .typing.active {
            display: block;
        }

        .typing-bubble {
            width: fit-content;

            padding: 10px 14px;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.06);

            border:
                1px solid rgba(255,255,255,0.06);
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 5px;
            height: 5px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.55);

            animation: typing 1.2s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.30s;
        }

        /* INPUT */

        .composer {
            display: flex;
            align-items: flex-end;

            gap: 10px;

            padding: 14px 16px 16px;

            border-top:
                1px solid rgba(255,255,255,0.07);

            background:
                rgba(0,0,0,0.12);
        }

        .input-wrap {
            flex: 1;

            display: flex;
            align-items: flex-end;

            border:
                1px solid rgba(255,255,255,0.09);

            border-radius: 18px;

            background:
                rgba(255,255,255,0.045);

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .input-wrap:focus-within {
            border-color:
                rgba(170,95,255,0.50);

            background:
                rgba(255,255,255,0.06);
        }

        textarea {
            width: 100%;

            min-height: 46px;
            max-height: 130px;

            padding: 13px 15px;

            border: 0;
            outline: none;

            resize: none;

            background: transparent;

            color: #fff;

            font-family: inherit;
            font-size: 14px;

            line-height: 1.4;
        }

        textarea::placeholder {
            color:
                rgba(255,255,255,0.28);
        }

        .send-button {
            width: 47px;
            height: 47px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 0;
            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #9956ff,
                    #d150c2
                );

            color: #fff;

            cursor: pointer;

            box-shadow:
                0 9px 24px rgba(153,75,255,0.25);

            transition:
                transform 0.18s ease,
                opacity 0.18s ease;
        }

        .send-button:hover {
            transform: translateY(-2px);
        }

        .send-button:active {
            transform: scale(0.94);
        }

        .send-button:disabled {
            opacity: 0.4;
            cursor: default;
            transform: none;
        }

        .send-icon {
            width: 18px;
            height: 18px;

            fill: currentColor;
        }

        /* LOADING */

        .loading {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                rgba(8,8,12,0.55);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            z-index: 10;
        }

        .loading.hidden {
            display: none;
        }

        .loader {
            width: 30px;
            height: 30px;

            border: 2px solid rgba(255,255,255,0.15);

            border-top-color:
                #b76aff;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        /* ERROR */

        .error-message {
            display: none;

            padding: 9px 16px;

            text-align: center;

            font-size: 12px;

            color: #ff9aa9;

            background:
                rgba(255,80,110,0.06);
        }

        .error-message.active {
            display: block;
        }

        /* ANIMATIONS */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.55;
                transform: scale(0.8);
            }
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.35;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes drift {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(38px, 38px);
            }
        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 0;

                align-items: stretch;
            }

            .chat-shell {
                width: 100%;
                height: 100vh;

                border-radius: 0;

                border-left: 0;
                border-right: 0;
            }

            .messages {
                padding-left: 14px;
                padding-right: 14px;
            }

            .bubble {
                max-width: 84%;
            }

            .composer {
                padding:
                    10px 10px
                    calc(10px + env(safe-area-inset-bottom))
                    10px;
            }

            .chat-header {
                padding:
                    14px 15px;
            }
        }

        .payment-link-button {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-top: 11px;

            padding: 11px 15px;

            border-radius: 12px;

            background:
                rgba(255,255,255,0.16);

            border:
                1px solid rgba(255,255,255,0.18);

            color: #fff;

            text-decoration: none;

            font-size: 13px;
            font-weight: 600;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .payment-link-button:hover {
            background:
                rgba(255,255,255,0.24);

            border-color:
                rgba(255,255,255,0.30);

            transform:
                translateY(-1px);
        }

        .payment-link-button:active {
            transform:
                translateY(0);
        }
    </style>
</head>

<body>

<div class="chat-shell">

    <div class="loading" id="loading">
        <div class="loader"></div>
    </div>

    <div class="chat-header">

        <div class="avatar">
            S
        </div>

        <div class="header-info">

            <div class="header-name">
                Sarah
            </div>

            <div class="header-status">
                <span class="status-dot"></span>
                Private Chat Space
            </div>

        </div>

    </div>

    <div
        class="error-message"
        id="errorMessage"
    ></div>

    <div
        class="messages"
        id="messages"
    >

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-icon">
                💬
            </div>

            <h2>
                Chat with Sarah
            </h2>

            <p>
                Have something you want to ask?
                Send me a message. This is your
                private conversation space.
            </p>

        </div>

    </div>

    <div
        class="typing"
        id="typing"
    >
        <div class="typing-bubble">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>

    <form
        class="composer"
        id="composer"
    >

        <div class="input-wrap">

            <textarea
                id="messageInput"
                placeholder="Write a message..."
                rows="1"
                maxlength="5000"
            ></textarea>

        </div>

        <button
            type="submit"
            class="send-button"
            id="sendButton"
            disabled
            aria-label="Send message"
        >

            <svg
                class="send-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M3.4 20.4 22 12 3.4 3.6 3.3 10l13.3 2-13.3 2z"
                />
            </svg>

        </button>

    </form>

</div>

<script>

    const messagesElement =
        document.getElementById("messages");

    const welcomeElement =
        document.getElementById("welcome");

    const loadingElement =
        document.getElementById("loading");

    const errorElement =
        document.getElementById("errorMessage");

    const composer =
        document.getElementById("composer");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const typingElement =
        document.getElementById("typing");


    let conversationId = null;

    let lastMessageId = 0;

    let polling = null;


    function showError(message) {

        errorElement.textContent = message;

        errorElement.classList.add("active");

    }


    function hideError() {

        errorElement.textContent = "";

        errorElement.classList.remove("active");

    }


    function scrollToBottom() {

        requestAnimationFrame(() => {

            messagesElement.scrollTop =
                messagesElement.scrollHeight;

        });

    }


    function formatTime(dateString) {

        const date =
            new Date(dateString);

        return date.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );

    }


    function createMessage(message) {

        const row =
            document.createElement("div");

        row.className =
            `message-row ${
                message.sender === "admin"
                    ? "admin"
                    : "visitor"
            }`;


        const bubble =
            document.createElement("div");

        bubble.className = "bubble";


        const text =
            document.createElement("div");

        const paymentMarker =
            "[[PAYMENT_LINK]]";

        if (
            message.message.includes(paymentMarker)
        ) {

            const parts =
                message.message.split(
                    paymentMarker
                );

            const textBefore =
                parts[0].trim();

            if (textBefore) {

                const messageText =
                    document.createElement("div");

                messageText.textContent =
                    textBefore;

                text.appendChild(
                    messageText
                );
            }


            const paymentUrl =
                parts[1].trim();


            const linkButton =
                document.createElement("a");

            linkButton.href =
                paymentUrl;

            linkButton.target =
                "_blank";

            linkButton.rel =
                "noopener noreferrer";

            linkButton.className =
                "payment-link-button";

            linkButton.innerHTML = `
                <span>🔗</span>
                <span>Open Exclusive Page</span>
            `;

            text.appendChild(
                linkButton
            );

        } else {

            text.textContent =
                message.message;
        }


        const meta =
            document.createElement("div");

        meta.className =
            "message-meta";


        const time =
            document.createElement("span");

        time.textContent =
            formatTime(message.created_at);


        meta.appendChild(time);


        if (message.sender === "visitor") {

            const tick =
                document.createElement("span");

            tick.className = "tick";

            tick.textContent =
                message.delivered
                    ? "✓✓"
                    : "✓";

            meta.appendChild(tick);
        }


        bubble.appendChild(text);

        bubble.appendChild(meta);

        row.appendChild(bubble);

        return row;

    }


    function renderMessages(messages) {

        welcomeElement.style.display =
            messages.length ? "none" : "block";


        for (const message of messages) {

            if (
                document.querySelector(
                    `[data-message-id="${message.id}"]`
                )
            ) {
                continue;
            }


            const element =
                createMessage(message);

            element.dataset.messageId =
                message.id;


            messagesElement.appendChild(
                element
            );


            if (message.id > lastMessageId) {

                lastMessageId =
                    message.id;

            }

        }


        scrollToBottom();

    }


    async function createConversation() {

        const response =
            await fetch(
                "/api/chat/conversation",
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to start chat."
            );

        }


        conversationId =
            data.conversationId;


        localStorage.setItem(
            "sarah_chat_conversation",
            conversationId
        );

    }


    async function loadMessages() {

        if (!conversationId) {
            return;
        }


        const response =
            await fetch(
                `/api/chat/messages?conversationId=${encodeURIComponent(conversationId)}`
            );


        if (response.status === 401) {

            localStorage.removeItem(
                "sarah_chat_conversation"
            );

            await createConversation();

            return loadMessages();

        }


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to load chat."
            );

        }


        renderMessages(
            data.messages || []
        );

    }


    async function initializeChat() {

        try {

            const savedConversation =
                localStorage.getItem(
                    "sarah_chat_conversation"
                );


            if (savedConversation) {

                conversationId =
                    savedConversation;

                try {

                    await loadMessages();

                } catch {

                    localStorage.removeItem(
                        "sarah_chat_conversation"
                    );

                    conversationId = null;

                }

            }


            if (!conversationId) {

                await createConversation();

                await loadMessages();

            }


            loadingElement.classList.add(
                "hidden"
            );


            startPolling();

        } catch (error) {

            loadingElement.classList.add(
                "hidden"
            );

            showError(
                error.message ||
                "Unable to start Chat Space."
            );

        }

    }


    async function sendMessage() {

        const message =
            messageInput.value.trim();


        if (
            !message ||
            !conversationId
        ) {
            return;
        }


        hideError();


        sendButton.disabled = true;


        try {

            const response =
                await fetch(
                    "/api/chat/messages",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            conversationId,
                            message
                        })
                    }
                );


            const data =
                await response.json();


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    "Unable to send message."
                );

            }


            messageInput.value = "";

            resizeTextarea();


            await loadMessages();

        } catch (error) {

            showError(
                error.message ||
                "Unable to send message."
            );

        }


        updateSendButton();

    }


    function startPolling() {

        if (polling) {
            clearInterval(polling);
        }


        polling =
            setInterval(
                async () => {

                    try {

                        await loadMessages();

                    } catch {
                        // Ignore temporary
                        // polling failures.
                    }

                },
                5000
            );

    }


    function updateSendButton() {

        sendButton.disabled =
            !messageInput.value.trim();

    }


    function resizeTextarea() {

        messageInput.style.height =
            "auto";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                130
            ) + "px";

    }


    composer.addEventListener(
        "submit",
        event => {

            event.preventDefault();

            sendMessage();

        }
    );


    messageInput.addEventListener(
        "input",
        () => {

            resizeTextarea();

            updateSendButton();

        }
    );


    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                if (!sendButton.disabled) {
                    sendMessage();
                }

            }

        }
    );


    initializeChat();

</script>

</body>
</html>
